<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>MouldShield architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#13294B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#13866B"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A97A8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="700" rx="18" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#13294B">How MouldShield works</text>
  <!-- legend -->
  <line x1="640" y1="38" x2="680" y2="38" stroke="#13866B" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="688" y="43" font-size="13" fill="#13294B">Working</text>
  <rect x="790" y="29" width="40" height="18" rx="4" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="838" y="43" font-size="13" fill="#13294B">Backup only</text>

  <!-- AWS boundary -->
  <rect x="260" y="70" width="570" height="420" rx="16" fill="#FFF8EE" stroke="#FF9900" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="278" y="96" font-size="14" font-weight="700" fill="#B36B00">AWS cloud (eu-west-2, London)</text>

  <!-- Device -->
  <g>
    <rect x="40" y="215" width="170" height="190" rx="14" fill="#EAF2FC" stroke="#2878D6" stroke-width="2"/>
    <!-- stick drawing -->
    <rect x="78" y="232" width="40" height="78" rx="9" fill="#5F6B7A"/>
    <rect x="84" y="240" width="28" height="44" rx="3" fill="#13866B"/>
    <text x="98" y="267" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="88" y="292" width="20" height="6" rx="3" fill="#2878D6"/>
    <!-- sensor -->
    <path d="M118 285 C 132 285, 132 275, 142 275" stroke="#8A97A8" stroke-width="2" fill="none"/>
    <rect x="142" y="262" width="30" height="30" rx="5" fill="#F4EFE6" stroke="#8A97A8"/>
    <circle cx="151" cy="272" r="1.6" fill="#8A97A8"/><circle cx="157" cy="272" r="1.6" fill="#8A97A8"/><circle cx="163" cy="272" r="1.6" fill="#8A97A8"/>
    <circle cx="151" cy="279" r="1.6" fill="#8A97A8"/><circle cx="157" cy="279" r="1.6" fill="#8A97A8"/><circle cx="163" cy="279" r="1.6" fill="#8A97A8"/>
    <text x="125" y="336" font-size="15" font-weight="700" fill="#13294B" text-anchor="middle">Device</text>
    <text x="125" y="356" font-size="12" fill="#13294B" text-anchor="middle">M5StickS3 + ENV III</text>
    <text x="125" y="374" font-size="12" fill="#4A5868" text-anchor="middle">temperature, humidity</text>
    <text x="125" y="391" font-size="12" fill="#4A5868" text-anchor="middle">red screen and beep</text>
  </g>

  <!-- IoT Core -->
  <g>
    <rect x="290" y="120" width="210" height="90" rx="12" fill="#FFFFFF" stroke="#FF9900" stroke-width="2"/>
    <circle cx="318" cy="148" r="13" fill="#FF9900"/>
    <circle cx="318" cy="148" r="5" fill="#FFFFFF"/>
    <path d="M308 138 A14 14 0 0 1 328 138 M308 158 A14 14 0 0 0 328 158" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="340" y="153" font-size="15" font-weight="700" fill="#13294B">AWS IoT Core</text>
    <text x="300" y="180" font-size="11" fill="#4A5868">topic: mouldshield/</text>
    <text x="300" y="195" font-size="11" fill="#4A5868">mouldshield-01/readings</text>
  </g>

  <!-- Bedrock -->
  <g>
    <rect x="540" y="120" width="125" height="90" rx="12" fill="#FFFFFF" stroke="#FF9900" stroke-width="2"/>
    <text x="602" y="150" font-size="14" font-weight="700" fill="#13294B" text-anchor="middle">Amazon</text>
    <text x="602" y="167" font-size="14" font-weight="700" fill="#13294B" text-anchor="middle">Bedrock</text>
    <text x="602" y="186" font-size="11" fill="#4A5868" text-anchor="middle">AI explanation,</text>
    <text x="602" y="200" font-size="11" fill="#4A5868" text-anchor="middle">letter, photo text</text>
  </g>

  <!-- S3 -->
  <g>
    <rect x="685" y="120" width="125" height="90" rx="12" fill="#FFFFFF" stroke="#FF9900" stroke-width="2"/>
    <path d="M730 140 L765 140 L760 168 L735 168 Z" fill="#E7F3EE" stroke="#13866B" stroke-width="2"/>
    <ellipse cx="747.5" cy="140" rx="17.5" ry="4" fill="#13866B"/>
    <text x="747" y="188" font-size="14" font-weight="700" fill="#13294B" text-anchor="middle">Amazon S3</text>
    <text x="747" y="203" font-size="11" fill="#4A5868" text-anchor="middle">mould photos</text>
  </g>

  <!-- EC2 server group -->
  <rect x="290" y="250" width="520" height="220" rx="14" fill="#F3F6FA" stroke="#13294B" stroke-width="1.5"/>
  <text x="392" y="274" font-size="13" font-weight="700" fill="#13294B">Back-end server</text>
  <text x="796" y="430" font-size="11" fill="#4A5868" text-anchor="end">Runs on Amazon EC2 (London) since 27 October</text>

  <!-- Subscriber -->
  <g>
    <rect x="306" y="300" width="140" height="74" rx="10" fill="#FFFFFF" stroke="#2878D6" stroke-width="2"/>
    <text x="376" y="330" font-size="13" font-weight="700" fill="#13294B" text-anchor="middle">Subscriber</text>
    <text x="376" y="347" font-size="13" font-weight="700" fill="#13294B" text-anchor="middle">script</text>
    <text x="376" y="364" font-size="11" fill="#4A5868" text-anchor="middle">own certificate</text>
  </g>

  <!-- FastAPI -->
  <g>
    <rect x="490" y="300" width="160" height="74" rx="10" fill="#FFFFFF" stroke="#2878D6" stroke-width="2"/>
    <text x="570" y="326" font-size="14" font-weight="700" fill="#13294B" text-anchor="middle">FastAPI back-end</text>
    <text x="570" y="345" font-size="11" fill="#4A5868" text-anchor="middle">risk level, report,</text>
    <text x="570" y="360" font-size="11" fill="#4A5868" text-anchor="middle">GET /verify</text>
  </g>

  <!-- SQLite cylinder -->
  <g>
    <path d="M690 318 L690 388 A50 12 0 0 0 790 388 L790 318" fill="#FFFFFF" stroke="#2878D6" stroke-width="2"/>
    <ellipse cx="740" cy="318" rx="50" ry="12" fill="#EAF2FC" stroke="#2878D6" stroke-width="2"/>
    <text x="740" y="350" font-size="14" font-weight="700" fill="#13294B" text-anchor="middle">SQLite</text>
    <text x="740" y="367" font-size="11" fill="#4A5868" text-anchor="middle">readings +</text>
    <text x="740" y="382" font-size="11" fill="#4A5868" text-anchor="middle">SHA-256 chain</text>
  </g>
  <text x="796" y="452" font-size="11" fill="#4A5868" text-anchor="end">Changing an old reading shows "Tampered"</text>

  <!-- Open-Meteo -->
  <g>
    <rect x="860" y="120" width="120" height="90" rx="12" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2"/>
    <circle cx="903" cy="146" r="10" fill="#FFC83D"/>
    <path d="M905 158 a10 10 0 0 1 16 -8 a8 8 0 0 1 12 10 z" fill="#C9D3E0"/>
    <text x="920" y="183" font-size="14" font-weight="700" fill="#13294B" text-anchor="middle">Open-Meteo</text>
    <text x="920" y="199" font-size="11" fill="#4A5868" text-anchor="middle">weather forecast</text>
  </g>

  <!-- Simulator -->
  <g>
    <rect x="860" y="300" width="120" height="74" rx="10" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="920" y="328" font-size="13" font-weight="700" fill="#13294B" text-anchor="middle">Data simulator</text>
    <text x="920" y="346" font-size="11" fill="#4A5868" text-anchor="middle">backup if the</text>
    <text x="920" y="361" font-size="11" fill="#4A5868" text-anchor="middle">device fails</text>
  </g>

  <!-- Dashboard -->
  <g>
    <rect x="290" y="550" width="300" height="120" rx="14" fill="#EAF2FC" stroke="#2878D6" stroke-width="2"/>
    <!-- laptop -->
    <rect x="312" y="572" width="70" height="44" rx="4" fill="#13294B"/>
    <rect x="317" y="577" width="60" height="34" rx="2" fill="#FFFFFF"/>
    <rect x="322" y="583" width="16" height="22" rx="2" fill="#13866B"/>
    <rect x="342" y="583" width="16" height="22" rx="2" fill="#FFB020"/>
    <rect x="362" y="583" width="10" height="22" rx="2" fill="#D64545"/>
    <rect x="304" y="616" width="86" height="6" rx="3" fill="#5F6B7A"/>
    <!-- phone -->
    <rect x="400" y="568" width="30" height="54" rx="6" fill="#13294B"/>
    <rect x="404" y="575" width="22" height="38" rx="2" fill="#D64545"/>
    <text x="515" y="590" font-size="15" font-weight="700" fill="#13294B" text-anchor="middle">Web dashboard</text>
    <text x="515" y="608" font-size="12" fill="#4A5868" text-anchor="middle">laptop and phones</text>
    <text x="515" y="624" font-size="12" fill="#4A5868" text-anchor="middle">(QR code)</text>
    <text x="440" y="654" font-size="12" fill="#13294B" text-anchor="middle">green, amber or red risk</text>
  </g>

  <!-- Report -->
  <g>
    <rect x="650" y="550" width="210" height="120" rx="14" fill="#FFFFFF" stroke="#2878D6" stroke-width="2"/>
    <path d="M675 572 L705 572 L715 582 L715 620 L675 620 Z" fill="#FFFFFF" stroke="#13294B" stroke-width="2"/>
    <line x1="682" y1="590" x2="707" y2="590" stroke="#8A97A8" stroke-width="2"/>
    <line x1="682" y1="599" x2="707" y2="599" stroke="#8A97A8" stroke-width="2"/>
    <line x1="682" y1="608" x2="700" y2="608" stroke="#8A97A8" stroke-width="2"/>
    <text x="790" y="592" font-size="14" font-weight="700" fill="#13294B" text-anchor="middle">PDF report</text>
    <text x="790" y="610" font-size="12" fill="#4A5868" text-anchor="middle">letter to the</text>
    <text x="790" y="626" font-size="12" fill="#4A5868" text-anchor="middle">landlord</text>
    <text x="755" y="654" font-size="11" fill="#4A5868" text-anchor="middle">draft, not legal advice</text>
  </g>

  <!-- ARROWS -->
  <!-- 1 device to IoT Core (working) -->
  <path d="M210 270 C 245 270, 250 165, 288 165" stroke="#13866B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="40" y="128" width="200" height="60" rx="8" fill="#E7F3EE"/>
  <text x="140" y="148" font-size="12" font-weight="700" fill="#13866B" text-anchor="middle">MQTT over TLS, port 8883</text>
  <text x="140" y="164" font-size="11" fill="#13294B" text-anchor="middle">device X.509 certificate,</text>
  <text x="140" y="179" font-size="11" fill="#13294B" text-anchor="middle">publish to its own topic only</text>

  <!-- 2 IoT Core to subscriber -->
  <path d="M376 210 L376 298" stroke="#13866B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="384" y="248" font-size="11" fill="#13294B">subscribe</text>

  <!-- 3 subscriber to FastAPI -->
  <path d="M446 337 L488 337" stroke="#13866B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="467" y="392" font-size="10" fill="#13294B" text-anchor="middle">POST</text>
  <text x="467" y="404" font-size="10" fill="#13294B" text-anchor="middle">/readings</text>

  <!-- 4 FastAPI to SQLite -->
  <path d="M650 345 L688 345" stroke="#13866B" stroke-width="3" fill="none" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>

  <!-- 5 FastAPI to Bedrock -->
  <path d="M590 300 L600 212" stroke="#13866B" stroke-width="3" fill="none" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>

  <!-- 6 FastAPI to S3 -->
  <path d="M630 300 L720 212" stroke="#13866B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- 7 Open-Meteo to FastAPI -->
  <path d="M860 190 C 835 245, 700 250, 648 302" stroke="#13866B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- 8 simulator to FastAPI (route below SQLite) -->
  <path d="M860 360 C 830 420, 680 420, 620 376" stroke="#13866B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- 9 FastAPI to dashboard (working) -->
  <path d="M540 374 C 520 470, 460 500, 440 548" stroke="#13866B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="494" y="440" font-size="10" fill="#13294B" text-anchor="end">HTTPS via CloudFront:</text>
  <text x="494" y="452" font-size="10" fill="#13294B" text-anchor="end">readings, report,</text>
  <text x="494" y="464" font-size="10" fill="#13294B" text-anchor="end">photos, forecast</text>

  <!-- 10 dashboard to report -->
  <path d="M590 610 L648 610" stroke="#13866B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
</svg>
